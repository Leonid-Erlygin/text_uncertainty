seed_everything: 777
mode: predict
weights_path: /app/outputs/scaleface_whale/epoch=1-step=6378.ckpt
trainer:
  _target_: pytorch_lightning.Trainer
  callbacks:
  - _target_: training.models.scf.Prediction_writer
    output_dir: /app/cache/features/ 
    file_name: whale_embs
    write_interval: epoch
  max_epochs: 2
  accelerator: gpu
  devices: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 3
  default_root_dir: outputs/scaleface_whale
  enable_checkpointing: true
model:
    _target_: training.models.scaleface.ScaleFace
    backbone:
        _target_: training.models.lightning_wrappers.EfficientNet
        checkpoint_path: /app/model_weights/whale_arcface/last-v4.ckpt
        learnable: False
    head:
        _target_: training.models.heads.SCFHead
        convf_dim: 776
        latent_vector_size: 4096
    scaleface_loss:
        _target_: training.models.losses.ArcFaceLoss
        m: 0.5
    optimizer_params:
        optimizer_path: torch.optim
        optimizer_name: AdamW
        params:
            lr: 3e-2
            weight_decay: 5e-4
    scheduler_params:
        scheduler: OneCycleLR
        params:
            max_lr: 3e-3
            steps_per_epoch: 3191
            epochs: 4
            div_factor: 1e1
            final_div_factor: 1e2
        interval: step
    permute_batch: False
    compute_embs: True

data:
    _target_: training.dataset_classes.lightning_datasets.UncertaintyDataModule
    train_dataset:
        _target_: training.dataset_classes.lightning_datasets.WhaleDataset    
        config_path: /app/training/models/whale_arcface/config/efficientnet_b6_new.yaml
        image_dir: /app/datasets/whale_images
    validation_dataset:
        _target_: training.dataset_classes.arcface_ijb.IJB_aligned_images
        dataset_path: /app/datasets/arcface_ijb/IJBC
        dataset_name: IJBC
        norm_image: True

    predict_dataset:
        _target_: training.dataset_classes.lightning_datasets.WhaleDataset    
        config_path: /app/training/models/whale_arcface/config/efficientnet_b6_new.yaml
        image_dir: /app/datasets/whale_images
        test: True
    # predict_dataset:
    #     _target_: training.dataset_classes.lightning_datasets.WhaleDataset    
    #     config_path: /app/training/models/whale_arcface/config/efficientnet_b6_new.yaml
    #     image_dir: /app/datasets/whale_images
    #     test: True
    batch_size: 16
    num_workers: 8