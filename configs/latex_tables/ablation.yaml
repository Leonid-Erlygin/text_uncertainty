# DO NOT CHANGE
hydra:
  run:
    dir: ${exp_dir}
exp_dir: outputs/latex_tables

defaults:
  - _self_
  - pretty_names@pretty_name.dataset: dataset_pretty_name
  - pretty_names@pretty_name.model: model_pretty_name
  - pretty_names@pretty_name.column: column_pretty_name
  - meta_data@metric_order: metric_order


datasets: ["IJBC"]
task: filter

metric_table_path: outputs/experiments/compare_norms/open_set_identification/{dataset}/filter_tabels/f1_class_prr_filtering.csv

caption: >
  Prediction Rejection Ratio (PRR) of $F_1$ filtering curve on IJB-C dataset.
  
fix_table: False
table_lable: "tab:${task}_ablation"
round_num: 2
table_size: normalsize
tabcolsep: 6
use_adjustbox: False

used_columns: []
sort_models_with: "used_models"
used_columns_dict:
  filter:
    whale:
      [
        "models",
        "FAR=0.05",
        "FAR=0.1",
        "FAR=0.2",
      ]
    IJBB:
      [
        "models",
        "FAR=0.05",
        "FAR=0.1",
        "FAR=0.2",
      ]
    IJBC:
      [
        "models",
        "FAR=0.05",
        "FAR=0.1",
        "FAR=0.2"
      ]
  



