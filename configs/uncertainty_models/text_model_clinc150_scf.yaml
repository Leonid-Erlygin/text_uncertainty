seed_everything: 777
mode: train
trainer:
  _target_: pytorch_lightning.Trainer
  logger:
    _target_: pytorch_lightning.loggers.mlflow.MLFlowLogger
    experiment_name: "Text Recongition CLINC150"
    run_name: "bert scf"
  callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint 
    every_n_epochs: 1
    dirpath: outputs/text_scf/clinc150
    save_last: True
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"
  - _target_: training.models.scf.Prediction_writer
    output_dir: /app/cache/features/
    file_name: scf_2epoch_clinc150_val_embs
    write_interval: epoch
  max_epochs: 4
  accelerator: gpu
  devices: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 3
  default_root_dir: outputs/text_scf/clinc150
  enable_checkpointing: true
  

model:
    _target_: training.models.scf.SphereConfidenceFace
    backbone:
        _target_: training.models.lightning_wrappers.BERTEmbedder
        model_name: "bert-base-uncased"
        num_features: 768
        bottleneck_dim: 768
        freeze_projection: true
        freeze_backbone: true
        backbone_path: /app/model_weights/backbone/bert_clinc150/backbone.pth
    head:
        _target_: training.models.heads.SCFHead
        convf_dim: 768
        latent_vector_size: 512
    scf_loss:
        _target_: training.models.losses.KLDiracVMF
        z_dim: 768
        radius: 1.
    softmax_weights:
        _target_: training.models.scf.SoftmaxWeights
        softmax_weights_path: "/app/model_weights/backbone/bert_clinc150/softmax_weight.pt"
        radius: 1
    optimizer_params:
        optimizer_path: torch.optim
        optimizer_name: AdamW
        params:
          lr: 1e-3
          weight_decay: 1e-4
    scheduler_params:
        scheduler: OneCycleLR
        params:
          max_lr: 1e-3
          steps_per_epoch: 117  
          epochs: 4
          div_factor: 10
          final_div_factor: 100
        interval: step
    permute_batch: false

data:
    _target_: training.dataset_classes.text_datasets.Clinc150DataModule
    json_path: /app/datasets/clinc150/data_full.json
    tokenizer_name: "bert-base-uncased"
    batch_size: 128
    num_workers: 32
    max_length: 64

