seed_everything: 777
mode: train
trainer:
  _target_: pytorch_lightning.Trainer
  logger:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CIFAR10"
    name: "Arcface"
  callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint 
    every_n_epochs: 1
    dirpath: outputs/arcface_cifar10/base
    save_last: True
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"
#   - _target_: training.models.scf.Prediction_writer
#     output_dir: /app/cache/features/
#     file_name: scf_2epoch_embs
#     write_interval: epoch
  max_epochs: 20
  accelerator: gpu
  devices: 1
  # num_sanity_val_steps: 0
  log_every_n_steps: 3
  default_root_dir: outputs/arcface_cifar10/base
  val_check_interval: 125
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  
model:
    _target_: training.models.arcface.MetricLearningModel
    backbone:
        _target_: training.models.lightning_wrappers.ResNet
        resnet_name: iresnet18_normalized
        weights: False
        learnable: True
    loss:
        _target_: training.models.losses.ArcFaceLoss
    num_labels: 10
    num_features: 512
    scheduler_params:
        scheduler: OneCycleLR
        params:
            max_lr: 3e-2
            steps_per_epoch: 125
            epochs: 20
            div_factor: 1e1
            final_div_factor: 1e2
        interval: step
    weight_decay: 1e-1


data:
    _target_: training.dataset_classes.lightning_datasets.UncertaintyDataModule
    train_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR10
        root_dir: /app/datasets/cifar10
        train: True
    validation_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR10
        root_dir: /app/datasets/cifar10
        train: False

    predict_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR10
        root_dir: /app/datasets/cifar10
        train: False
    batch_size: 400
    num_workers: 20