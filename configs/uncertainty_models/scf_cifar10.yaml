seed_everything: 777
mode: train
trainer:
  _target_: pytorch_lightning.Trainer
  logger:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CIFAR10"
    name: "Arcface"
  callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint 
    every_n_epochs: 1
    dirpath: outputs/scf_cifar10/base
    save_last: True
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"
#   - _target_: training.models.scf.Prediction_writer
#     output_dir: /app/cache/features/
#     file_name: scf_2epoch_embs
#     write_interval: epoch
  max_epochs: 20
  accelerator: gpu
  devices: 1
  # num_sanity_val_steps: 0
  log_every_n_steps: 3
  default_root_dir: outputs/scf_cifar10/base
  val_check_interval: 125
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  
model:
model:
    _target_: training.models.scf.SphereConfidenceFace
    backbone:
        _target_: training.models.lightning_wrappers.ResNet
        resnet_name: iresnet50_normalized
        weights: /app/model_weights/backbone/ms1mv3_arcface_r50/backbone.pth
        learnable: False
    head:
        _target_: training.models.heads.SCFHead
        convf_dim: 25088
        latent_vector_size: 4096
    scf_loss:
        _target_: training.models.losses.KLDiracVMF
        z_dim: 512
        radius: 64
    softmax_weights:
        _target_: training.models.scf.SoftmaxWeights
        softmax_weights_path: "/app/model_weights/backbone/ms1mv3_arcface_r50/softmax_weight.pt"
        radius: 64
    optimizer_params:
        optimizer_path: torch.optim
        optimizer_name: AdamW
        params:
            lr: 3e-2
            weight_decay: 1e-2
    scheduler_params:
        scheduler: OneCycleLR
        params:
            max_lr: 3e-2
            steps_per_epoch: 125
            epochs: 20
            div_factor: 1e1
            final_div_factor: 1e2
        interval: step
    permute_batch: False


data:
    _target_: training.dataset_classes.lightning_datasets.UncertaintyDataModule
    train_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR10
        root_dir: /app/datasets/cifar10
        train: True
    validation_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR10
        root_dir: /app/datasets/cifar10
        train: False

    predict_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR10
        root_dir: /app/datasets/cifar10
        train: False
    batch_size: 400
    num_workers: 20