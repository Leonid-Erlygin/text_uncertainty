seed_everything: 42
mode: train

trainer:
  _target_: pytorch_lightning.Trainer
  logger:
    _target_: pytorch_lightning.loggers.mlflow.MLFlowLogger
    experiment_name: "PAN Authorship Recognition"
    run_name: "bert-arcface-pan-xl"
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: "val_loss"
      mode: "min"
      save_top_k: 3
      dirpath: "outputs/pan_bert_arcface"
      filename: "epoch={epoch:02d}-val_loss={val_loss:.4f}"
      save_last: True
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: "step"
    - _target_: pytorch_lightning.callbacks.EarlyStopping
      monitor: "val_loss"
      patience: 3
      mode: "min"
  max_epochs: 4
  accelerator: gpu
  devices: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  default_root_dir: "outputs/pan_bert_arcface"
  enable_checkpointing: true

model:
  _target_: training.models.arcface.MetricLearningModel
  backbone:
    _target_: training.models.lightning_wrappers.BERTEmbedder
    model_name: "bert-base-uncased"
    num_features: 768
    bottleneck_dim: 768
    freeze_projection: False
    freeze_backbone: False  # Fine-tune BERT for authorship style
  loss:
    _target_: training.models.losses.ArcFaceLoss
    s: 4  # Higher scale for text (vs face)
  num_labels: 15000  # Will be overridden by datamodule.train_dataset.num_classes
  num_features: 768
  optimizer_params:
    optimizer_path: torch.optim
    optimizer_name: AdamW
    params:
      lr: 2e-5
      weight_decay: 1e-4
  scheduler_params:
    scheduler: OneCycleLR
    params:
      max_lr: 1e-3
      epochs: 4
      steps_per_epoch: 1135  # Will be auto-calculated by PL
      div_factor: 1e1
      final_div_factor: 1e2
    interval: step

data:
  _target_: training.dataset_classes.pan_text.PANDataModule
  train_jsonl: "/app/datasets/pan/unseen_authors/xl/pan20-av-large-notest.jsonl"
  test_jsonl: "/app/datasets/pan/unseen_authors/xl/pan20-av-large-test.jsonl"
  tokenizer_name: "bert-base-uncased"
  batch_size: 192  # Smaller due to long texts (512 tokens)
  num_workers: 16
  max_length: 512
  min_docs_per_author: 5
  train_authors: 15000
  val_gallery_authors: 2000
  val_probe_authors: 2000