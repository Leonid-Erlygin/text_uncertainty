seed_everything: 777
mode: train
trainer:
  _target_: pytorch_lightning.Trainer
  logger:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CIFAR100N"
    name: "Arcface cifar100 r50"
  callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint 
    every_n_epochs: 1
    dirpath: outputs/arcface_cifar100N/base
    save_last: True
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"
#   - _target_: training.models.scf.Prediction_writer
#     output_dir: /app/cache/features/
#     file_name: scf_2epoch_embs
#     write_interval: epoch
  max_epochs: 20
  accelerator: gpu
  devices: 1
#   num_sanity_val_steps: 0
  log_every_n_steps: 3
  default_root_dir: outputs/arcface_cifar100N/base
  val_check_interval: 125
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  
model:
    _target_: training.models.arcface.MetricLearningModel
    backbone:
        _target_: training.models.lightning_wrappers.ResNet
        resnet_name: iresnet50_normalized
        weights: /app/model_weights/backbone/ms1mv3_arcface_r50/backbone.pth
        learnable: True
    loss:
        _target_: training.models.losses.ArcFaceLoss
        s: 4
    num_labels: 100
    num_features: 512
    scheduler_params:
        scheduler: OneCycleLR
        params:
            max_lr: 3e-2
            steps_per_epoch: 125
            epochs: 20
            div_factor: 1e1
            final_div_factor: 1e2
        interval: step
    weight_decay: 1e-4


data:
    _target_: training.dataset_classes.lightning_datasets.UncertaintyDataModule
    # train_dataset:
    #     _target_: training.dataset_classes.lightning_datasets.CIFAR
    #     root_dir: /app/datasets/cifar10
    #     train: True
    #     ds_name: CIFAR10
    # validation_dataset:
    #     _target_: training.dataset_classes.lightning_datasets.CIFAR
    #     root_dir: /app/datasets/cifar10
    #     train: False
    #     ds_name: CIFAR10
    train_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR
        root_dir: /app/datasets/cifar100
        train: True
        ds_name: CIFAR100
    validation_dataset:
        _target_: training.dataset_classes.lightning_datasets.CIFAR
        root_dir: /app/datasets/cifar100
        train: False
        ds_name: CIFAR100

    # train_dataset:
    #     _target_: training.dataset_classes.lightning_datasets.CIFAR_N
    #     root_dir: /app/datasets/cifar100
    #     ds_name: CIFAR100
    # validation_dataset:
    #     _target_: training.dataset_classes.lightning_datasets.CIFAR
    #     root_dir: /app/datasets/cifar100
    #     train: False
    #     ds_name: CIFAR100

    batch_size: 400
    num_workers: 20