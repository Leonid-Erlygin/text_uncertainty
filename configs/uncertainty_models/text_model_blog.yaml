seed_everything: 42
mode: train

trainer:
  _target_: pytorch_lightning.Trainer
  logger:
    _target_: pytorch_lightning.loggers.mlflow.MLFlowLogger
    experiment_name: "Blog Authorship Recognition"
    run_name: "bert-arcface-pan-xl"
  callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint 
    every_n_epochs: 1
    dirpath: outputs/bert_arcface_blog
    save_last: True
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"
  max_epochs: 16
  accelerator: gpu
  devices: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 3
  default_root_dir: "outputs/blog_bert_arcface"
  enable_checkpointing: true

model:
  _target_: training.models.arcface.MetricLearningModel
  backbone:
    _target_: training.models.lightning_wrappers.BERTEmbedder
    model_name: "bert-base-uncased"
    num_features: 768
    bottleneck_dim: 2048
    freeze_projection: False
    freeze_backbone: True
    proj_depth: 2
  loss:
    _target_: training.models.losses.ArcFaceLoss
    s: 4  # Higher scale for text (vs face)
  num_labels: 500  # Will be overridden by datamodule.train_dataset.num_classes
  num_features: 768
  optimizer_params:
    optimizer_path: torch.optim
    optimizer_name: AdamW
    params:
      lr: 2e-5
      weight_decay: 1e-4
  scheduler_params:
    scheduler: OneCycleLR
    params:
      max_lr: 1e-2
      epochs: 16
      steps_per_epoch: 85
      div_factor: 1e1
      final_div_factor: 1e2
    interval: step

data:
  _target_: training.dataset_classes.blog_text.BlogAuthorshipDataModule
  csv_path: "/app/datasets/blog_authorship_corpus/blogtext.csv"
  tokenizer_name: "bert-base-uncased"
  batch_size: 512
  num_workers: 16
  max_length: 512
  min_docs_per_author: 20
  train_authors: 500
  val_authors: 500
  val_probe_authors: 1000
  test_authors: 1000
  predict_on_split: test